name: API CI and deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api-light.txt
      - name: Install API and test dependencies
        run: python -m pip install -r requirements-api-light.txt 'pytest>=8,<9'
      - name: Run API tests
        run: python -m pytest api/tests

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: sentiment-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare API package
        run: |
          mkdir -p deploy-package/api
          cp -R api/app deploy-package/api/app
          cp requirements.txt requirements-api-light.txt deploy-package/
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: oc-project-7
          package: deploy-package
      - name: Verify deployed API
        env:
          EXPECTED_RUN_ID: ${{ vars.LIGHT_MODEL_RUN_ID }}
        run: |
          HOSTNAME=$(az webapp show --resource-group OC_projects --name oc-project-7 --query defaultHostName --output tsv)
          export HEALTH_URL="https://${HOSTNAME}/health"
          python .github/scripts/check_api_health.py
